name: Iris ML API - CI Pipeline - CSE

#Define when Github should run this workflow
on:
#Run CI whenever code is pushed to main branch
  push:
    branches:
      - main
#Run CI whenever a pull request is opened against main branch
  pull_request:
    branches:
      - main
    
# permissions are restricted to read repo content
permissions:
  contents: read

#Define the jobs that make up the pipeline
jobs:
  test-and-build:
    # Github repo provides a frest Ubuntu virtual environment for this job
    runs-on: ubuntu-latest

    steps:
      #Step-1: Download the repo content to the runner
      - name: Check out repository
        uses: actions/checkout@v4
      
      #Step-2: Install Python on the runner
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      #Step-3: Install python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #Step-4: Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v
      
      #Step-5: Build the docker image
      - name: Build Docker image
        run: |
          docker build -t iris-ml-api:#{{ github.sha }}